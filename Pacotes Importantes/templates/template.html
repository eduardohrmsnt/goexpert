<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cursos</h1>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Data de Início</th>
                <th>Data de Término</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            {{if eq .CargaHoraria 40}}
            <tr>
                <td>{{ .Nome | toUpper}}</td>
                <td>{{ .CargaHoraria }}</td>
            </tr>
            {{end}}
            {{end}}
        </tbody>
    </table>
</body>
</html>
